[package]
name = "quartz_forge"
version = "0.1.0"
edition = "2024"

[features]
# The editor (egui window, previews). The MCP server and the codegen/import
# library build without it: `default-features = false` (see mcp_server/).
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image", "dep:libloading"]

[[bin]]
name = "quartz_forge"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "qf_verify_generated"
path = "src/bin/qf_verify_generated.rs"
required-features = ["gui"]

[[bin]]
name = "quartz_forge_mcp"
path = "src/bin/quartz_forge_mcp.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", features = ["wgpu"], optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = true, optional = true }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
# PathForge backgrounds are previewed by the PathForge plugin (src/plugin/path_forge), which
# loads PathForge's runtime library when a preview opens: PathForge is not a build dependency.
libloading = { version = "0.8", optional = true }

[profile.dev.package.png]
opt-level = 3
