[package]
name = "quartz_forge"
version = "0.1.0"
edition = "2024"

[features]
# The editor (egui window, previews). The MCP server and the codegen/import
# library build without it: `default-features = false` (see mcp_server/).
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:rfd", "dep:image", "dep:path_forge"]

[[bin]]
name = "quartz_forge"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "qf_verify_generated"
path = "src/bin/qf_verify_generated.rs"
required-features = ["gui"]

[[bin]]
name = "quartz_forge_mcp"
path = "src/bin/quartz_forge_mcp.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", features = ["wgpu"], optional = true }
egui = { version = "0.29", optional = true }
rfd = { version = "0.14", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = true, optional = true }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
# PathForge backgrounds: previewed with PathForge's own runtime (no studio, no GPU).
path_forge = { git = "https://github.com/Artistsyn/path_forge", branch = "main", default-features = false, optional = true }

# The editor is run as a debug build; PathForge renders on the CPU and needs optimising.
[profile.dev.package.path_forge]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
